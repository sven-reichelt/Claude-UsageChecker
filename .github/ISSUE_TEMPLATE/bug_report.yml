name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        > [!CAUTION]
        > **Never paste an access token.** Tokens look like `sk-ant-oat01-…` and
        > grant full access to your Claude subscription. On Windows they appear in
        > `%USERPROFILE%\.claude\.credentials.json` — do not attach that file.
        > `crash.log`, `settings.json` and `alerts.json` contain no tokens and are
        > safe to share.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: The tray icon stayed grey although the weekly limit was at 95 %.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it happens every time, the exact steps help most.
      placeholder: |
        1. Start the application
        2. Open Settings, set …
        3. Wait for the next refresh
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the menu, beside "About Claude UsageChecker".
      placeholder: "1.0.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Windows Server
        - macOS (Apple silicon)
        - Other (please describe below)
    validations:
      required: true

  - type: dropdown
    id: plan
    attributes:
      label: Claude subscription
      description: Limits differ between plans. Max and Pro have been measured; Team and Enterprise have not.
      options:
        - Max
        - Pro
        - Team or Enterprise
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: token-source
    attributes:
      label: How does the application authenticate?
      description: Shown at the bottom of the details window ("Source: …").
      options:
        - Own sign-in (OAuth)
        - Token from a running Claude Code installation
        - Token stored by a version before 0.6
        - Environment variable
        - Not sure
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: crash.log
      description: |
        Found at `%LOCALAPPDATA%\ClaudeUsageChecker\crash.log` on Windows, or
        `~/Library/Application Support/ClaudeUsageChecker/crash.log` on macOS, if it exists.
        It contains no tokens — `AccessToken.ToString()` masks them.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues
          required: true
        - label: This report contains no access token and no account data
          required: true
