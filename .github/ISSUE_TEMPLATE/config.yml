# Blank issues stay enabled: not every report fits a form, and a rigid form is
# a worse outcome than a free-form issue that actually gets written.
blank_issues_enabled: true

contact_links:
  - name: Security vulnerability
    url: https://github.com/sven-reichelt/Claude-UsageChecker/security/advisories/new
    about: >-
      Please do not open a public issue. The application handles an OAuth token
      that grants full access to a Claude subscription — report privately.

  - name: User guide
    url: https://github.com/sven-reichelt/Claude-UsageChecker/blob/main/docs/guide/en.md
    about: >-
      Every window explained, in nine languages, with a section on what to do
      when something does not work. Worth a look before opening an issue.
