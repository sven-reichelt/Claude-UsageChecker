name: Release

# A release is created by pushing a tag, "v0.2.0" for instance. This workflow
# builds, tests and attaches the result together with its checksum to the GitHub
# release - exactly the source the application's update check feeds on.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne fuehrendes v, z. B. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  # The Mac build runs first and hands its bundle over as an artifact. It has to
  # happen on a Mac: the icon is made with sips and iconutil, and only there does
  # a bundle end up with the right shape.
  macos:
    name: Build the macOS bundle
    runs-on: macos-15
    # It builds and hands an artifact over; the write right of the workflow is
    # for creating the release, which is the other job's business.
    permissions:
      contents: read

    # So that the notes can say what was actually done rather than what is
    # usually done.
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      - name: Derive the version from the tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Unusable version '$VERSION'. Expected x.y.z or x.y.z-label."
            exit 1
          fi
          # Apple wants one to three numbers and nothing else in the bundle
          # version. The label lives on in the informational version, which is
          # where the application reads it from anyway.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "numbers=${VERSION%%-*}" >> "$GITHUB_OUTPUT"

      # No single file here. On macOS the native libraries stay beside the
      # executable rather than being packed in, and a bundle is the place where
      # they are meant to sit: Contents/MacOS, loaded straight from there. Self
      # extraction would unpack them into a temporary folder on every start, for
      # nothing.
      - name: Publish
        run: >
          dotnet publish src/ClaudeUsageChecker.App
          --configuration Release
          --runtime osx-arm64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          --output publish

      - name: Build the application bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="ClaudeUsageChecker.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R publish/. "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/ClaudeUsageChecker"

          # The icon, in the sizes macOS asks for.
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icons/app.png \
              --out "icon.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double assets/icons/app.png \
              --out "icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Claude UsageChecker</string>
              <key>CFBundleDisplayName</key>
              <string>Claude UsageChecker</string>
              <key>CFBundleIdentifier</key>
              <string>de.sven-reichelt.claudeusagechecker</string>
              <key>CFBundleExecutable</key>
              <string>ClaudeUsageChecker</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ steps.version.outputs.numbers }}</string>
              <key>CFBundleVersion</key>
              <string>${{ steps.version.outputs.numbers }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
              <!-- A menu bar application and nothing else: no dock icon, no
                   window on start, no entry in the app switcher. Without this
                   the program would sit in the dock with no window to show. -->
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP/Contents/Info.plist"

      # Signing needs the certificate; without it the build still has to work,
      # so that a fork or a checkout without secrets is not stopped by it. What
      # comes out then is the ad-hoc signed bundle of before, which runs on the
      # machine that built it and nowhere else.
      - name: Is signing configured?
        id: signing
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing with a Developer ID certificate."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing certificate configured - the bundle will be signed ad hoc."
          fi

      - name: Take the certificate into a keychain of its own
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # A keychain of its own, thrown away with the runner: the login
          # keychain of a shared machine is no place for a signing key.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Without this codesign asks for permission on every call, and nobody
          # is there to answer.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign the bundle
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="ClaudeUsageChecker.app"

          # Inside out: everything beside the launcher first, the bundle last. A
          # signature made over a bundle whose contents change afterwards is
          # broken, and --deep, which would do this in one call, is deprecated
          # by Apple and known to miss things.
          #
          # Everything, not only the libraries: codesign treats every file in
          # Contents/MacOS as part of the program, whatever its format, and
          # refuses to verify a bundle in which one of them is unsigned - "code
          # object is not signed at all", pointing at a managed .NET assembly.
          # Those assemblies have to sit beside the launcher, because that is
          # where the .NET host looks for them.
          find "$APP/Contents/MacOS" -type f ! -name "ClaudeUsageChecker" -print0 \
            | xargs -0 -n1 codesign --force --timestamp --options runtime \
                --keychain "$KEYCHAIN" --sign "$IDENTITY"

          # Two entitlements, and the reasoning belongs here because it cannot
          # live in the file: codesign parses that plist with AMFI, which
          # rejects XML comments outright ("syntax error near line 6").
          #
          # The hardened runtime is what Apple requires before it will notarise
          # anything, and it forbids by default exactly what a just-in-time
          # compiler does: write machine code and then execute it. Without
          # allow-jit and allow-unsigned-executable-memory the bundle would be
          # signed, notarised, and dead on arrival.
          #
          # Deliberately absent: disabling library validation. Every library in
          # the bundle carries the same signature as the bundle, which is what
          # that check asks for - so switching it off would buy nothing and give
          # up a real safeguard.
          codesign --force --timestamp --options runtime \
            --entitlements build/macos/entitlements.plist \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" "$APP"

          codesign --verify --strict --verbose=2 "$APP"

      - name: Have it notarised
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="ClaudeUsageChecker.app"

          # Pasted values pick up stray whitespace, and the complaint that
          # comes back names only the mangled value - which the log masks. So
          # they are trimmed here and checked before Apple is troubled.
          KEY_ID="$(printf %s "$API_KEY_ID" | tr -d '[:space:]')"
          ISSUER_ID="$(printf %s "$API_ISSUER_ID" | tr -d '[:space:]')"

          UUID='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if ! printf %s "$ISSUER_ID" | grep -qE "$UUID"; then
            echo "::error::APPLE_API_ISSUER_ID is not a UUID. It is the Issuer ID standing above the key table in App Store Connect - not the Key ID, which is ten characters and belongs in APPLE_API_KEY_ID."
            exit 1
          fi

          if ! printf %s "$KEY_ID" | grep -qE '^[0-9A-Za-z]{8,12}$'; then
            echo "::error::APPLE_API_KEY_ID does not look like a Key ID. It is the ten-character value in the key table, and it also stands in the name of the .p8 file."
            exit 1
          fi

          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/api-key.p8"

          # Apple wants an archive, and the answer takes a few minutes.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarise.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --key "$RUNNER_TEMP/api-key.p8" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --wait --timeout 30m

          rm -f "$RUNNER_TEMP/api-key.p8" "$RUNNER_TEMP/notarise.zip"

          # Stapling writes the ticket into the bundle. Without it macOS asks
          # Apple at first launch, which fails on a machine that is offline -
          # and looks exactly like a program that was never notarised.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Would macOS let it run?
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The question Gatekeeper will be asked on someone else's machine,
          # asked here instead. Anything but "accepted" means whoever downloads
          # this gets a refusal rather than a program.
          spctl --assess --type install --verbose=4 ClaudeUsageChecker.app
          codesign --display --verbose=4 ClaudeUsageChecker.app 2>&1 | grep -E "Authority|TeamIdentifier|flags"

      # Ad-hoc, not a developer certificate. It gives the bundle a stable
      # identity on the machine it runs on, which is what the keychain hangs the
      # right of access on - without it every start would look like a different
      # program and ask again.
      - name: Sign the bundle ad hoc
        if: steps.signing.outputs.enabled != 'true'
        run: codesign --force --deep --sign - ClaudeUsageChecker.app

      - name: Does the bundle start at all?
        shell: bash
        run: |
          set -uo pipefail
          # A package that does not start must reach nobody. What can be caught
          # here is an immediate crash - and whatever it said on the way out.
          "ClaudeUsageChecker.app/Contents/MacOS/ClaudeUsageChecker" > start.log 2>&1 &
          PID=$!
          sleep 25
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID"
            echo "Started successfully."
            exit 0
          fi

          wait "$PID" && STATUS=0 || STATUS=$?
          echo "--- exit code $STATUS"
          echo "--- standard output and error"
          cat start.log || true
          echo "--- crash log"
          cat "$HOME/Library/Application Support/ClaudeUsageChecker/crash.log" 2>/dev/null || echo "(none)"
          echo "::error::The application exited immediately (exit code $STATUS)."
          exit 1

      - name: Pack it up
        shell: bash
        run: |
          set -euo pipefail
          # ditto rather than zip: it keeps the symbolic links and the flags of
          # the bundle, which a plain zip quietly flattens. Without
          # --sequesterRsrc: that option parks extended attributes in __MACOSX
          # entries, which unzip then scatters as folders of that name beside
          # the bundle. The signature lives in _CodeSignature and needs none of
          # it.
          ditto -c -k --keepParent \
            ClaudeUsageChecker.app ClaudeUsageChecker-macos-arm64.zip
          shasum -a 256 ClaudeUsageChecker-macos-arm64.zip \
            | sed 's/  .*/  ClaudeUsageChecker-macos-arm64.zip/' \
            > ClaudeUsageChecker-macos-arm64.zip.sha256
          cat ClaudeUsageChecker-macos-arm64.zip.sha256

      - name: Hand it over
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-bundle
          path: |
            ClaudeUsageChecker-macos-arm64.zip
            ClaudeUsageChecker-macos-arm64.zip.sha256
          if-no-files-found: error

  release:
    name: Build and publish
    runs-on: windows-latest
    needs: macos

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      - name: Derive the version from the tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Three numbers, optionally a pre-release label: "0.7.1" or
          # "0.7.1-beta.1". The label makes the release a pre-release below and
          # travels into the informational version, where the application reads
          # it - without it a pre-release and the finished version of the same
          # number would be indistinguishable.
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Unusable version '$VERSION'. Expected x.y.z or x.y.z-label."
            exit 1
          fi
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (pre-release: $PRERELEASE)"

      - name: Test
        run: dotnet test --configuration Release --verbosity normal

      # Trimming and compression live in the project file, so that a local
      # "dotnet publish" produces the same result as this workflow.
      - name: Publish
        run: >
          dotnet publish src/ClaudeUsageChecker.App
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          --output publish

      - name: Check the size
        shell: pwsh
        run: |
          # If the package grows unexpectedly, trimming has usually failed.
          $mb = [math]::Round((Get-Item publish/ClaudeUsageChecker.exe).Length / 1MB, 1)
          Write-Host "Package size: $mb MB"
          if ($mb -gt 35) {
            Write-Error "At $mb MB the package is unexpectedly large - is trimming still working?"
            exit 1
          }

      # Deliberately without a version number in the file name. The self-update
      # writes the new version to the path of the running file; a versioned name
      # would afterwards claim the wrong version. More important still: Windows
      # remembers the tray pinning per path - if the name did not stay the same,
      # the icon would land in the overflow area after every update.
      - name: Compute the checksum
        id: package
        shell: pwsh
        run: |
          $name = "ClaudeUsageChecker.exe"

          $hash = (Get-FileHash "publish/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "publish/$name.sha256" -Encoding ascii

          $size = [math]::Round((Get-Item "publish/$name").Length / 1MB, 1)
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Does the built version start at all?
        shell: pwsh
        run: |
          # A package that does not start must reach nobody. The application
          # lives in the tray, but at least an immediate crash can be caught here.
          $exe = "publish/${{ steps.package.outputs.name }}"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Write-Error "The application exited immediately (exit code $($p.ExitCode))."
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Started successfully."

      - name: Collect the macOS bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-bundle
          path: publish

      - name: Read the macOS checksum
        id: macos
        shell: pwsh
        run: |
          $name = "ClaudeUsageChecker-macos-arm64.zip"
          # Recomputed here rather than trusted: the file travelled through
          # an artifact store between two machines.
          $hash = (Get-FileHash "publish/$name" -Algorithm SHA256).Hash.ToLower()
          $claimed = (Get-Content "publish/$name.sha256").Split(" ")[0]
          if ($hash -ne $claimed) {
            Write-Error "The macOS bundle does not match its checksum."
            exit 1
          }
          $size = [math]::Round((Get-Item "publish/$name").Length / 1MB, 1)
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: v${{ steps.version.outputs.version }}
          # Not github.ref_name: on a manual run that would be a branch name.
          tag_name: v${{ steps.version.outputs.version }}
          # Draft: the update check only sees it once it is published by hand.
          # That way nothing goes out unchecked.
          draft: true
          # A version with a label reaches only whoever chose pre-releases.
          # GitHub leaves it out of "latest" as well.
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          # LICENSE travels with the binary: the GPL wants its text to accompany
          # the program, and whoever downloads only the exe would otherwise never
          # see it.
          files: |
            publish/${{ steps.package.outputs.name }}
            publish/${{ steps.package.outputs.name }}.sha256
            publish/${{ steps.macos.outputs.name }}
            publish/${{ steps.macos.outputs.name }}.sha256
            LICENSE
          body: |
            ## Claude UsageChecker ${{ steps.version.outputs.version }}

            Self-contained - no .NET runtime required.

            | | |
            |---|---|
            | **Windows (x64)** | `ClaudeUsageChecker.exe`, ${{ steps.package.outputs.size }} MB |
            | **macOS (Apple silicon)** | `${{ steps.macos.outputs.name }}`, ${{ steps.macos.outputs.size }} MB |

            ### Installation on Windows

            Download the file and start it. On the first start Windows
            SmartScreen reports an unknown publisher, because the package is not
            signed - confirm through **More info -> Run anyway**.

            Then sign in under Settings, so that the application obtains access
            rights of its own.

            ### Installation on macOS

            ${{ needs.macos.outputs.signed == 'true' && 'Signed with a Developer ID and notarised by Apple, with the ticket stapled to the bundle: it opens on any Mac, straight from the browser, without asking anything of you.' || 'Signed ad hoc rather than by a registered developer, so macOS refuses it unless it is fetched from the terminal rather than through a browser.' }}

            Either way the terminal is the shortest route:

            ```
            pkill -f ClaudeUsageChecker
            rm -rf /Applications/ClaudeUsageChecker.app
            curl -L -O https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/${{ steps.macos.outputs.name }}
            ditto -xk ${{ steps.macos.outputs.name }} .
            mv ClaudeUsageChecker.app /Applications/
            open -a /Applications/ClaudeUsageChecker.app
            ```

            The same sequence installs and updates. The first two lines have
            nothing to do on a fresh machine and say so harmlessly; on an
            existing installation they are what makes the rest work at all,
            because `mv` refuses to overwrite a bundle that is already there -
            it moves the new one inside the old, and the application carries on
            running from the version that was meant to be replaced.

            The icon appears in the menu bar; the application has no dock icon
            and no window of its own on start.

            ${{ needs.macos.outputs.signed == 'true' && ' ' || 'Downloaded through a browser after all? `xattr -dr com.apple.quarantine /Applications/ClaudeUsageChecker.app` takes it out of quarantine.' }}

            ### Checksums (SHA-256)

            ```
            ${{ steps.package.outputs.sha256 }}  ClaudeUsageChecker.exe
            ${{ steps.macos.outputs.sha256 }}  ${{ steps.macos.outputs.name }}
            ```

            ### License

            Free software under the [GNU General Public License
            v3](https://www.gnu.org/licenses/gpl-3.0.html) or later - the text
            is attached as `LICENSE`. The corresponding source is this
            repository, at the tag of this release. No warranty of any kind.
