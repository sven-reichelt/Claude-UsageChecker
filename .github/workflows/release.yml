name: Release

# A release is created by pushing a tag, "v0.2.0" for instance. This workflow
# builds, tests and attaches the result together with its checksum to the GitHub
# release - exactly the source the application's update check feeds on.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne fuehrendes v, z. B. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  # The Mac build runs first and hands its bundle over as an artifact. It has to
  # happen on a Mac: the icon is made with sips and iconutil, and only there does
  # a bundle end up with the right shape.
  macos:
    name: Build the macOS bundle
    runs-on: macos-15
    # It builds and hands an artifact over; the write right of the workflow is
    # for creating the release, which is the other job's business.
    permissions:
      contents: read

    # So that the notes can say what was actually done rather than what is
    # usually done.
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      - name: Derive the version from the tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Unusable version '$VERSION'. Expected x.y.z or x.y.z-label."
            exit 1
          fi
          # Apple wants one to three numbers and nothing else in the bundle
          # version. The label lives on in the informational version, which is
          # where the application reads it from anyway.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "numbers=${VERSION%%-*}" >> "$GITHUB_OUTPUT"

      # No single file here. On macOS the native libraries stay beside the
      # executable rather than being packed in, and a bundle is the place where
      # they are meant to sit: Contents/MacOS, loaded straight from there. Self
      # extraction would unpack them into a temporary folder on every start, for
      # nothing.
      - name: Publish
        run: >
          dotnet publish src/ClaudeUsageChecker.App
          --configuration Release
          --runtime osx-arm64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          --output publish

      - name: Build the application bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="ClaudeUsageChecker.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R publish/. "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/ClaudeUsageChecker"

          # The icon, in the sizes macOS asks for.
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icons/app.png \
              --out "icon.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double assets/icons/app.png \
              --out "icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Claude UsageChecker</string>
              <key>CFBundleDisplayName</key>
              <string>Claude UsageChecker</string>
              <key>CFBundleIdentifier</key>
              <string>de.sven-reichelt.claudeusagechecker</string>
              <key>CFBundleExecutable</key>
              <string>ClaudeUsageChecker</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ steps.version.outputs.numbers }}</string>
              <key>CFBundleVersion</key>
              <string>${{ steps.version.outputs.numbers }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
              <!-- A menu bar application and nothing else: no dock icon, no
                   window on start, no entry in the app switcher. Without this
                   the program would sit in the dock with no window to show. -->
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP/Contents/Info.plist"

      # Signing needs the certificate; without it the build still has to work,
      # so that a fork or a checkout without secrets is not stopped by it. What
      # comes out then is the ad-hoc signed bundle of before, which runs on the
      # machine that built it and nowhere else.
      - name: Is signing configured?
        id: signing
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing with a Developer ID certificate."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing certificate configured - the bundle will be signed ad hoc."
          fi

      - name: Take the certificate into a keychain of its own
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # A keychain of its own, thrown away with the runner: the login
          # keychain of a shared machine is no place for a signing key.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Without this codesign asks for permission on every call, and nobody
          # is there to answer.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign the bundle
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="ClaudeUsageChecker.app"

          # Inside out: everything beside the launcher first, the bundle last. A
          # signature made over a bundle whose contents change afterwards is
          # broken, and --deep, which would do this in one call, is deprecated
          # by Apple and known to miss things.
          #
          # Everything, not only the libraries: codesign treats every file in
          # Contents/MacOS as part of the program, whatever its format, and
          # refuses to verify a bundle in which one of them is unsigned - "code
          # object is not signed at all", pointing at a managed .NET assembly.
          # Those assemblies have to sit beside the launcher, because that is
          # where the .NET host looks for them.
          find "$APP/Contents/MacOS" -type f ! -name "ClaudeUsageChecker" -print0 \
            | xargs -0 -n1 codesign --force --timestamp --options runtime \
                --keychain "$KEYCHAIN" --sign "$IDENTITY"

          # Two entitlements, and the reasoning belongs here because it cannot
          # live in the file: codesign parses that plist with AMFI, which
          # rejects XML comments outright ("syntax error near line 6").
          #
          # The hardened runtime is what Apple requires before it will notarise
          # anything, and it forbids by default exactly what a just-in-time
          # compiler does: write machine code and then execute it. Without
          # allow-jit and allow-unsigned-executable-memory the bundle would be
          # signed, notarised, and dead on arrival.
          #
          # Deliberately absent: disabling library validation. Every library in
          # the bundle carries the same signature as the bundle, which is what
          # that check asks for - so switching it off would buy nothing and give
          # up a real safeguard.
          codesign --force --timestamp --options runtime \
            --entitlements build/macos/entitlements.plist \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" "$APP"

          codesign --verify --strict --verbose=2 "$APP"

      - name: Have it notarised
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="ClaudeUsageChecker.app"

          # Pasted values pick up stray whitespace, and the complaint that
          # comes back names only the mangled value - which the log masks. So
          # they are trimmed here and checked before Apple is troubled.
          KEY_ID="$(printf %s "$API_KEY_ID" | tr -d '[:space:]')"
          ISSUER_ID="$(printf %s "$API_ISSUER_ID" | tr -d '[:space:]')"

          UUID='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if ! printf %s "$ISSUER_ID" | grep -qE "$UUID"; then
            echo "::error::APPLE_API_ISSUER_ID is not a UUID. It is the Issuer ID standing above the key table in App Store Connect - not the Key ID, which is ten characters and belongs in APPLE_API_KEY_ID."
            exit 1
          fi

          if ! printf %s "$KEY_ID" | grep -qE '^[0-9A-Za-z]{8,12}$'; then
            echo "::error::APPLE_API_KEY_ID does not look like a Key ID. It is the ten-character value in the key table, and it also stands in the name of the .p8 file."
            exit 1
          fi

          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/api-key.p8"

          # Apple wants an archive, and the answer takes a few minutes.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarise.zip"

          # Submitted first, waited for second. "submit --wait" reports a
          # timeout and nothing else - not the identifier, not what Apple
          # thought - and a run that ends knowing nothing is a run wasted.
          CREDENTIALS=(--key "$RUNNER_TEMP/api-key.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID")

          SUBMISSION="$(xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            "${CREDENTIALS[@]}" --output-format json | jq -r '.id')"
          echo "Submission: $SUBMISSION"

          # Apple is usually done in minutes; the first submission of a new
          # account can take considerably longer. A generous limit costs
          # nothing when it is quick, because waiting ends the moment the
          # verdict arrives.
          xcrun notarytool wait "$SUBMISSION" "${CREDENTIALS[@]}" --timeout 45m || true

          STATUS="$(xcrun notarytool info "$SUBMISSION" "${CREDENTIALS[@]}" \
            --output-format json | jq -r '.status')"
          echo "Apple says: $STATUS"

          if [ "$STATUS" != "Accepted" ]; then
            # Whatever Apple objected to, in its own words. Without this the
            # only thing to go on is a status word.
            xcrun notarytool log "$SUBMISSION" "${CREDENTIALS[@]}" || true
            rm -f "$RUNNER_TEMP/api-key.p8" "$RUNNER_TEMP/notarise.zip"

            if [ "$STATUS" = "In Progress" ]; then
              # Not a fault, and not something a rerun mends. Apple puts the
              # first submissions of a new Developer ID through a deeper
              # analysis while it builds a profile of the software; the
              # developer forums put that at hours to a day or two, after which
              # later submissions come back in minutes. Apple's own threshold
              # for asking after one is a week.
              #
              # So: wait, follow it with the "Ask Apple about a submission"
              # workflow, which costs seconds instead of the three quarters of
              # an hour this job just spent, and start the release again once it
              # has been accepted once.
              echo "::error::Apple is still analysing $SUBMISSION after the wait. That is expected of the first submissions from a new Developer ID and needs no fix - follow it with the \"Ask Apple about a submission\" workflow and release again once one has been accepted."
            else
              echo "::error::Notarisation ended as $STATUS. Submission $SUBMISSION."
            fi
            exit 1
          fi

          rm -f "$RUNNER_TEMP/api-key.p8" "$RUNNER_TEMP/notarise.zip"

          # Stapling writes the ticket into the bundle. Without it macOS asks
          # Apple at first launch, which fails on a machine that is offline -
          # and looks exactly like a program that was never notarised.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Would macOS let it run?
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The question Gatekeeper will be asked on someone else's machine,
          # asked here instead. Anything but "accepted" means whoever downloads
          # this gets a refusal rather than a program.
          #
          # "execute", not "install": that is the rule set macOS applies when
          # someone opens an application. "install" assesses installer packages
          # and answered for a while here - the wrong question, politely
          # answered "accepted", while the bundle a tester double-clicked was
          # being refused.
          spctl --assess --type execute --verbose=4 ClaudeUsageChecker.app
          codesign --display --verbose=4 ClaudeUsageChecker.app 2>&1 | grep -E "Authority|TeamIdentifier|flags"

      # Ad-hoc, not a developer certificate. It gives the bundle a stable
      # identity on the machine it runs on, which is what the keychain hangs the
      # right of access on - without it every start would look like a different
      # program and ask again.
      - name: Sign the bundle ad hoc
        if: steps.signing.outputs.enabled != 'true'
        run: codesign --force --deep --sign - ClaudeUsageChecker.app

      - name: Does the bundle start at all?
        shell: bash
        run: |
          set -uo pipefail
          # A package that does not start must reach nobody. What can be caught
          # here is an immediate crash - and whatever it said on the way out.
          "ClaudeUsageChecker.app/Contents/MacOS/ClaudeUsageChecker" > start.log 2>&1 &
          PID=$!
          sleep 25
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID"
            echo "Started successfully."
            exit 0
          fi

          wait "$PID" && STATUS=0 || STATUS=$?
          echo "--- exit code $STATUS"
          echo "--- standard output and error"
          cat start.log || true
          echo "--- crash log"
          cat "$HOME/Library/Application Support/ClaudeUsageChecker/crash.log" 2>/dev/null || echo "(none)"
          echo "::error::The application exited immediately (exit code $STATUS)."
          exit 1

      - name: Pack it up
        shell: bash
        run: |
          set -euo pipefail
          # ditto rather than zip: it keeps the symbolic links and the flags of
          # the bundle, which a plain zip quietly flattens. Without
          # --sequesterRsrc: that option parks extended attributes in __MACOSX
          # entries, which unzip then scatters as folders of that name beside
          # the bundle. The signature lives in _CodeSignature and needs none of
          # it.
          ditto -c -k --keepParent \
            ClaudeUsageChecker.app ClaudeUsageChecker-macos-arm64.zip
          shasum -a 256 ClaudeUsageChecker-macos-arm64.zip \
            | sed 's/  .*/  ClaudeUsageChecker-macos-arm64.zip/' \
            > ClaudeUsageChecker-macos-arm64.zip.sha256
          cat ClaudeUsageChecker-macos-arm64.zip.sha256

      # The zip above is what the application fetches for its own update, and it
      # unpacks that with ditto, which restores everything. A person downloading
      # through a browser has no such guarantee: 202 of the 221 files in this
      # bundle are managed .NET assemblies, and those are not Mach-O, so codesign
      # cannot put their signature inside them - it goes into an extended
      # attribute beside them. A zip can only carry those as AppleDouble
      # side-cars, and whether they come back as attributes depends entirely on
      # the tool that unpacks it.
      #
      # A disk image has no such step. It is a filesystem, the attributes sit in
      # it the way they sit on a disk, and double-clicking mounts it rather than
      # unpacking it. Nothing stands between the signature and Gatekeeper.
      - name: Put it in a disk image
        shell: bash
        run: |
          set -euo pipefail
          DMG="ClaudeUsageChecker-macos-arm64.dmg"
          STAGE="$RUNNER_TEMP/dmg"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          # ditto rather than cp: the extended attributes carrying the
          # signatures are the whole point of this exercise.
          ditto ClaudeUsageChecker.app "$STAGE/ClaudeUsageChecker.app"
          # The shortcut that makes the window a drag-and-drop target.
          ln -s /Applications "$STAGE/Applications"

          # HFS+ rather than APFS: it keeps extended attributes just as well and
          # mounts on every macOS this application claims to support, back to 12.
          hdiutil create \
            -volname "Claude UsageChecker" \
            -srcfolder "$STAGE" \
            -fs HFS+ -format UDZO -ov \
            "$DMG"

      - name: Sign and notarise the disk image
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="ClaudeUsageChecker-macos-arm64.dmg"

          # The image is a second thing to be trusted, not merely a wrapper: it
          # is what the download carries and what Gatekeeper inspects first. The
          # bundle inside already has its own ticket from the submission above.
          codesign --force --timestamp \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" "$DMG"

          KEY_ID="$(printf %s "$API_KEY_ID" | tr -d '[:space:]')"
          ISSUER_ID="$(printf %s "$API_ISSUER_ID" | tr -d '[:space:]')"
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/api-key.p8"
          CREDENTIALS=(--key "$RUNNER_TEMP/api-key.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID")

          SUBMISSION="$(xcrun notarytool submit "$DMG" \
            "${CREDENTIALS[@]}" --output-format json | jq -r '.id')"
          echo "Submission: $SUBMISSION"

          xcrun notarytool wait "$SUBMISSION" "${CREDENTIALS[@]}" --timeout 45m || true

          STATUS="$(xcrun notarytool info "$SUBMISSION" "${CREDENTIALS[@]}" \
            --output-format json | jq -r '.status')"
          echo "Apple says: $STATUS"

          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$SUBMISSION" "${CREDENTIALS[@]}" || true
            rm -f "$RUNNER_TEMP/api-key.p8"
            echo "::error::Notarisation of the disk image ended as $STATUS. Submission $SUBMISSION."
            exit 1
          fi

          rm -f "$RUNNER_TEMP/api-key.p8"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      # The check that was missing, and whose absence a tester found instead: up
      # to here every question was asked of the bundle lying on this runner, and
      # that one nobody downloads. What ships is the image and the zip, so those
      # are what get asked.
      - name: Would a double-click do?
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DMG="ClaudeUsageChecker-macos-arm64.dmg"
          MOUNT="$RUNNER_TEMP/mnt"

          echo "=== the disk image, mounted the way a double-click mounts it ==="
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          # A trap so a failing check still gives the runner its image back.
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT

          APP="$MOUNT/ClaudeUsageChecker.app"
          codesign --verify --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

          hdiutil detach "$MOUNT" -quiet
          trap - EXIT

          echo "=== the zip, unpacked the way the application unpacks it ==="
          UNPACKED="$RUNNER_TEMP/from-zip"
          rm -rf "$UNPACKED"
          ditto -xk ClaudeUsageChecker-macos-arm64.zip "$UNPACKED"
          codesign --verify --strict --verbose=2 "$UNPACKED/ClaudeUsageChecker.app"
          xcrun stapler validate "$UNPACKED/ClaudeUsageChecker.app"
          spctl --assess --type execute --verbose=4 "$UNPACKED/ClaudeUsageChecker.app"

      # Not a gate: this is the measurement nobody had. A tester's double-click
      # on the zip produced "Apple could not verify ... is free of malware", and
      # whether Archive Utility drops those extended attributes was guessed at
      # rather than known. Now the runner says so out loud on every release. It
      # decides nothing - the disk image is the answer either way - but a
      # recorded fact beats a plausible story.
      - name: What does Archive Utility make of the zip?
        if: steps.signing.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          PROBE="$RUNNER_TEMP/probe"
          rm -rf "$PROBE"
          mkdir -p "$PROBE"
          cp ClaudeUsageChecker-macos-arm64.zip "$PROBE/"

          # The same program the Finder hands a double-clicked archive to.
          open -a "Archive Utility" "$PROBE/ClaudeUsageChecker-macos-arm64.zip"
          for _ in $(seq 1 60); do
            [ -d "$PROBE/ClaudeUsageChecker.app" ] && break
            sleep 1
          done

          if [ ! -d "$PROBE/ClaudeUsageChecker.app" ]; then
            echo "Archive Utility produced nothing within a minute - no measurement this time."
            exit 0
          fi

          SIDECARS="$(find "$PROBE/ClaudeUsageChecker.app" -name '._*' | wc -l | tr -d ' ')"
          echo "AppleDouble side-cars left lying as files: $SIDECARS"
          echo "--- codesign"
          codesign --verify --strict --verbose=2 "$PROBE/ClaudeUsageChecker.app" || true
          echo "--- spctl"
          spctl --assess --type execute --verbose=4 "$PROBE/ClaudeUsageChecker.app" || true

      # Last, and that is not an accident: stapling the ticket rewrites the
      # image, so a sum taken before it would describe a file nobody receives.
      - name: Compute the disk image checksum
        shell: bash
        run: |
          set -euo pipefail
          DMG="ClaudeUsageChecker-macos-arm64.dmg"
          shasum -a 256 "$DMG" | sed "s|  .*|  $DMG|" > "$DMG.sha256"
          cat "$DMG.sha256"

      - name: Hand it over
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-bundle
          path: |
            ClaudeUsageChecker-macos-arm64.zip
            ClaudeUsageChecker-macos-arm64.zip.sha256
            ClaudeUsageChecker-macos-arm64.dmg
            ClaudeUsageChecker-macos-arm64.dmg.sha256
          if-no-files-found: error

  release:
    name: Build and publish
    runs-on: windows-latest
    needs: macos

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      - name: Derive the version from the tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Three numbers, optionally a pre-release label: "0.7.1" or
          # "0.7.1-beta.1". The label makes the release a pre-release below and
          # travels into the informational version, where the application reads
          # it - without it a pre-release and the finished version of the same
          # number would be indistinguishable.
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Unusable version '$VERSION'. Expected x.y.z or x.y.z-label."
            exit 1
          fi
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (pre-release: $PRERELEASE)"

      - name: Test
        run: dotnet test --configuration Release --verbosity normal

      # Trimming and compression live in the project file, so that a local
      # "dotnet publish" produces the same result as this workflow.
      - name: Publish
        run: >
          dotnet publish src/ClaudeUsageChecker.App
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          --output publish

      - name: Check the size
        shell: pwsh
        run: |
          # If the package grows unexpectedly, trimming has usually failed.
          $mb = [math]::Round((Get-Item publish/ClaudeUsageChecker.exe).Length / 1MB, 1)
          Write-Host "Package size: $mb MB"
          if ($mb -gt 35) {
            Write-Error "At $mb MB the package is unexpectedly large - is trimming still working?"
            exit 1
          }

      # Deliberately without a version number in the file name. The self-update
      # writes the new version to the path of the running file; a versioned name
      # would afterwards claim the wrong version. More important still: Windows
      # remembers the tray pinning per path - if the name did not stay the same,
      # the icon would land in the overflow area after every update.
      - name: Compute the checksum
        id: package
        shell: pwsh
        run: |
          $name = "ClaudeUsageChecker.exe"

          $hash = (Get-FileHash "publish/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "publish/$name.sha256" -Encoding ascii

          $size = [math]::Round((Get-Item "publish/$name").Length / 1MB, 1)
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Does the built version start at all?
        shell: pwsh
        run: |
          # A package that does not start must reach nobody. The application
          # lives in the tray, but at least an immediate crash can be caught here.
          $exe = "publish/${{ steps.package.outputs.name }}"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            Write-Error "The application exited immediately (exit code $($p.ExitCode))."
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Started successfully."

      - name: Collect the macOS bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-bundle
          path: publish

      - name: Read the macOS checksums
        id: macos
        shell: pwsh
        run: |
          # Two packages for one platform, and they are not alternatives: the
          # disk image is what a person downloads, the zip is what the
          # application fetches for its own update. Both are recomputed here
          # rather than trusted - they travelled through an artifact store
          # between two machines.
          foreach ($pair in @(@("zip", "ClaudeUsageChecker-macos-arm64.zip"),
                              @("dmg", "ClaudeUsageChecker-macos-arm64.dmg"))) {
            $key, $name = $pair
            $hash = (Get-FileHash "publish/$name" -Algorithm SHA256).Hash.ToLower()
            $claimed = (Get-Content "publish/$name.sha256").Split(" ")[0]
            if ($hash -ne $claimed) {
              Write-Error "$name does not match its checksum."
              exit 1
            }
            $size = [math]::Round((Get-Item "publish/$name").Length / 1MB, 1)
            "$key-name=$name"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "$key-sha256=$hash"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "$key-size=$size"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Create the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: v${{ steps.version.outputs.version }}
          # Not github.ref_name: on a manual run that would be a branch name.
          tag_name: v${{ steps.version.outputs.version }}
          # Draft: the update check only sees it once it is published by hand.
          # That way nothing goes out unchecked.
          draft: true
          # A version with a label reaches only whoever chose pre-releases.
          # GitHub leaves it out of "latest" as well.
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          # LICENSE travels with the binary: the GPL wants its text to accompany
          # the program, and whoever downloads only the exe would otherwise never
          # see it.
          files: |
            publish/${{ steps.package.outputs.name }}
            publish/${{ steps.package.outputs.name }}.sha256
            publish/${{ steps.macos.outputs.dmg-name }}
            publish/${{ steps.macos.outputs.dmg-name }}.sha256
            publish/${{ steps.macos.outputs.zip-name }}
            publish/${{ steps.macos.outputs.zip-name }}.sha256
            LICENSE
          body: |
            ## Claude UsageChecker ${{ steps.version.outputs.version }}

            Self-contained - no .NET runtime required.

            | | |
            |---|---|
            | **Windows (x64)** | `ClaudeUsageChecker.exe`, ${{ steps.package.outputs.size }} MB |
            | **macOS (Apple silicon)** | `${{ steps.macos.outputs.dmg-name }}`, ${{ steps.macos.outputs.dmg-size }} MB |

            > **On macOS take the `.dmg`.** That is the installation.
            >
            > The `.zip` beside it is attached for one purpose only: it is what
            > the application downloads for its **own update**, and it unpacks
            > that itself. It is not a second way to install - a bundle handed
            > to an unpacking tool of someone else's choosing is a bundle whose
            > signature depends on that tool, and the disk image exists so that
            > no tool gets between the two.

            ### Installation on Windows

            Download the file and start it. On the first start Windows
            SmartScreen reports an unknown publisher, because the package is not
            signed - confirm through **More info -> Run anyway**.

            Then sign in under Settings, so that the application obtains access
            rights of its own.

            ### Installation on macOS

            ${{ needs.macos.outputs.signed == 'true' && 'Signed with a Developer ID and notarised by Apple, image and application each with its own ticket: it opens on any Mac, offline as well, and nothing has to be talked out of the system by hand.' || 'Signed ad hoc rather than by a registered developer, so macOS refuses it unless it is fetched from the terminal rather than through a browser.' }}

            Open `${{ steps.macos.outputs.dmg-name }}` and **double-click the
            application inside it**. It notices that it is running from a disk
            image, offers to move into the Applications folder, starts from
            there and ejects the image behind it. Dragging it across by hand
            works just as well, if you prefer that.

            **macOS asks once**, whichever way you go: *"ClaudeUsageChecker" is
            an app downloaded from the internet. Are you sure you want to open
            it?* - and, underneath, that Apple checked it for malicious software
            and found none. That second sentence is the notarisation doing its
            job. Every application downloaded through a browser is asked after
            in this way, exactly once; **Open** is the answer.

            Coming from an older version, quit it first - the icon in the menu
            bar, **Quit**. From 0.9.0 on every later version arrives through
            **Install now and restart** in the application itself, the same way
            it has on Windows since 0.4.0, so this is a first installation and
            nothing more.

            The icon appears in the menu bar; the application has no dock icon
            and no window of its own on start.

            ${{ needs.macos.outputs.signed == 'true' && 'A disk image is used here rather than a zip for a reason: most of this application is managed .NET assemblies, which are not Mach-O, so their signatures live in extended attributes beside them. A zip carries those only as side-cars, and whether they survive depends on the tool that unpacks it. An image is mounted, not unpacked - nothing gets the chance to drop them.' || 'Downloaded through a browser after all? `xattr -dr com.apple.quarantine /Applications/ClaudeUsageChecker.app` takes it out of quarantine.' }}

            ### Checksums (SHA-256)

            ```
            ${{ steps.package.outputs.sha256 }}  ClaudeUsageChecker.exe
            ${{ steps.macos.outputs.dmg-sha256 }}  ${{ steps.macos.outputs.dmg-name }}
            ${{ steps.macos.outputs.zip-sha256 }}  ${{ steps.macos.outputs.zip-name }}
            ```

            ### License

            Free software under the [GNU General Public License
            v3](https://www.gnu.org/licenses/gpl-3.0.html) or later - the text
            is attached as `LICENSE`. The corresponding source is this
            repository, at the tag of this release. No warranty of any kind.
