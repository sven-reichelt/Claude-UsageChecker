name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Regenerate icons reproducibly
        shell: bash
        run: |
          node build/generate-icons.mjs
          # The committed icons have to match what the generator produces.
          git diff --exit-code -- assets/icons

  # The macOS build is checked on every push, not first at the release. The
  # application is developed on Windows, so nothing else would notice a
  # platform check gone wrong until the day it mattered.
  macos:
    name: Build and test on macOS
    runs-on: macos-15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      - name: Build for Apple silicon
        run: dotnet build src/ClaudeUsageChecker.App --configuration Release -r osx-arm64 --self-contained true

      # The whole suite, including the windows and the rendering. Avalonia's
      # headless platform runs on macOS too, and a layout that only holds on
      # one operating system is worth knowing about.
      - name: Test
        run: dotnet test --configuration Release --verbosity normal

  security:
    name: Security checks
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      - name: Check for vulnerable packages
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive 2>&1 | Tee-Object -Variable output
          if ($output -match 'has the following vulnerable packages') { exit 1 }

      # The same fault has now been found three times: in the language files,
      # in the continuation notes, and in this repository's own documentation,
      # where it had been sitting in public. It is invisible to every other test
      # - the text is still valid UTF-8, only wrong - so it gets a sweep of its
      # own.
      - name: Check for doubly encoded text
        shell: bash
        run: |
          # Three exceptions, all deliberate: this file carries the pattern it
          # searches for, the pitfall about this very fault quotes the mangled
          # word as an example, and one test asserts the absence of the
          # character.
          if git grep -nE 'Ã.|â€' \
               -- '*.md' '*.cs' '*.json' '*.yml' '*.axaml' '*.props' \
               ':(exclude).github/workflows/ci.yml' \
             | grep -v 'Pr..*fsumme' \
             | grep -v 'DoesNotContain'; then
            echo "::error::Doubly encoded text found - UTF-8 read as Latin-1 and encoded again."
            exit 1
          fi
          echo "No doubly encoded text found."

      - name: Check for accidentally committed secrets
        shell: bash
        run: |
          # A coarse but effective sweep for token patterns across the tree.
          if git grep -nE 'sk-ant-[a-zA-Z0-9_-]{10,}|oat01-[a-zA-Z0-9_-]{10,}' -- . ':(exclude)docs' ':(exclude)README.md' ':(exclude)SECURITY.md'; then
            echo "::error::Possible token found in the repository."
            exit 1
          fi
          echo "No token patterns found."
